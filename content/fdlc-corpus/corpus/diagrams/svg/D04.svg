<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D04 d-D04">
<title id="t-D04">Two Loops: Factory Lifecycle and Delivery Loop</title>
<desc id="d-D04">The outer Factory Lifecycle (Discover, Define, Design, Assemble, Qualify, Deploy, Operate, Improve) hosts the inner Delivery Loop (Receive, Specify, Plan, Route, Execute, Verify, Approve, Release, Observe, Learn), which runs only inside an Active Factory Version during the Operate stage. Learn sends Learning Signals to Improve; Improve changes behavior only by producing a new Factory Version that re-enters Qualify and Deploy.</desc>
