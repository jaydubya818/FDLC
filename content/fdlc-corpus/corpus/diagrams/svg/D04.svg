<rect x="1260" y="565" width="130" height="80" class="box trust"/>
<text x="1325.0" y="611.3" class="h2 t-trust c">9 Observe</text>
</g>
<path id="a-i8" d="M1390,605 L1410,605" class="fl thin"/>
<g id="inner-learn">
<rect x="1410" y="565" width="130" height="80" class="box learn"/>
<text x="1475.0" y="611.3" class="h2 t-learn c">10 Learn</text>
</g>
<path id="a-learn-improve" d="M1540,605 L1572,605 L1572,215 L1541,215" class="ln"/>
<text x="1586" y="410" class="label c" transform="rotate(-90 1586 410)">Learning Signals</text>
<text x="60" y="700" class="h3">Deploy promotes a Factory Version. Release promotes a software artifact. Neither transition creates its own authority.</text>
<text x="60" y="730" class="s">Outer loop artifacts: Opportunity record · Factory Manifest · Factory Design · Factory Version · Qualification Record · Active Factory Version · operating evidence · Improvement Candidate</text>
<text x="60" y="756" class="s">Inner loop artifacts: Intent · Specification · Plan · Work Order · Routing Decision · Attempt · Candidate · Evidence · Verification · Decision · Release · Outcome · Learning Signal</text>
<text x="60" y="800" class="xs">FDLC contains exactly two lifecycles. Every other published sequence is a labeled compression or projection of one of them.</text>
