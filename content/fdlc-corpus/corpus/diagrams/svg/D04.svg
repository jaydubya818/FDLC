<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">Two Loops: Factory Lifecycle and Delivery Loop</text>
<text x="60" y="108" class="sub">The Delivery Loop is the production line running; the Factory Lifecycle is how you build, certify, commission, and retool the line</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D04</text></g>
<text x="60" y="150" class="tag">Factory Lifecycle — outer loop · 8 stages</text>
<g id="outer-discover">
<rect x="60" y="175" width="165" height="80" class="box intent"/>
<text x="142.5" y="221.3" class="h2 t-intent c">1 Discover</text>
</g>
<path id="a-o0" d="M225,215 L247,215" class="fl thin"/>
<g id="outer-define">
