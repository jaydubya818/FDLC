</g>
<path id="a-improve-qualify" d="M1451,175 L1451,140 L890,140 L890,175" class="ln"/>
<rect x="1035.3" y="121.1" width="269.3" height="17.5" class="lbg" rx="3"/>
<text x="1170" y="133" class="label c">new Factory Version → Qualify → Deploy</text>
<polygon id="operate-wedge" points="1182,255 1347,255 1540,520 60,520" class="zone exec dash"/>
<rect x="380" y="368" width="840" height="74" class="lbg" rx="6"/>
<text x="800" y="395" class="h c">The Delivery Loop runs only inside an Active Factory Version — the Operate stage.</text>
<text x="800" y="425" class="s c">The outer loop changes behavior only by producing a new Factory Version.</text>
<text x="60" y="548" class="tag">Delivery Loop — inner loop · 10 steps</text>
<g id="inner-receive">
<rect x="60" y="565" width="130" height="80" class="box intent"/>
<text x="125.0" y="611.3" class="h2 t-intent c">1 Receive</text>
</g>
<path id="a-i0" d="M190,605 L210,605" class="fl thin"/>
