<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D01 d-D01">
<title id="t-D01">What is an Autonomous Software Factory</title>
<desc id="d-D01">A Builder states Intent. Under a control plane that holds authority, an AI Software Factory plans, routes, executes and independently verifies the work, producing Evidence. A human or policy Decision at the risk tier turns verified work into an accepted, released outcome. Outcomes feed Learning Signals that change the factory only through a new Factory Version. Authority flows down from the control plane; evidence flows back.</desc>
<style>
svg.fd{--fd-paper:#f3f1ea;--fd-surface:#faf9f5;--fd-ink:#171a18;--fd-muted:#59605a;--fd-line:#c9ccc4;
--fd-intent-fill:#dce8ef;--fd-intent-stroke:#2f5f78;--fd-intent-text:#1f4557;
--fd-control-fill:#e4e9ec;--fd-control-stroke:#4a5d68;--fd-control-text:#2f3f47;
--fd-exec-fill:#f5e6d0;--fd-exec-stroke:#9a4f1c;--fd-exec-text:#6b3612;
--fd-trust-fill:#dcefe4;--fd-trust-stroke:#1a654b;--fd-trust-text:#114735;
--fd-learn-fill:#e9e2f4;--fd-learn-stroke:#5c3f8f;--fd-learn-text:#3f2a66;
--fd-human:#b3261e;--fd-tint:.45}
@media (prefers-color-scheme:dark){svg.fd{--fd-paper:#15191b;--fd-surface:#1d2326;--fd-ink:#ecebe4;--fd-muted:#a8b0aa;--fd-line:#3b433d;
--fd-intent-fill:#1c3140;--fd-intent-stroke:#8ec1dc;--fd-intent-text:#cfe6f2;
--fd-control-fill:#2a3438;--fd-control-stroke:#a8bcc6;--fd-control-text:#dbe5ea;
--fd-exec-fill:#3b2812;--fd-exec-stroke:#e2a468;--fd-exec-text:#f5dcc0;
--fd-trust-fill:#143326;--fd-trust-stroke:#7fd2a6;--fd-trust-text:#cdeedb;
--fd-learn-fill:#2b2142;--fd-learn-stroke:#bfa5ea;--fd-learn-text:#e3d8f5;
--fd-human:#ff8a80;--fd-tint:.35}}
.bg{fill:var(--fd-paper)}
text{font-family:"Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fd-ink);font-size:16px}
.mono{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace}
.title{font-size:34px;font-weight:600}
.sub{font-size:18px;fill:var(--fd-muted)}
.h{font-size:20px;font-weight:600}.h2{font-size:18px;font-weight:600}.h3{font-size:16px;font-weight:600}
.b{font-size:16px}.s{font-size:15px;fill:var(--fd-muted)}.xs{font-size:14px;fill:var(--fd-muted)}
.i{font-style:italic}.c{text-anchor:middle}.r{text-anchor:end}.strong{font-weight:600}
.label{font-size:14px;fill:var(--fd-muted)}
.tag{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;fill:var(--fd-muted)}
.box{stroke-width:2;rx:6}
.intent{fill:var(--fd-intent-fill);stroke:var(--fd-intent-stroke)}
.control{fill:var(--fd-control-fill);stroke:var(--fd-control-stroke)}
.exec{fill:var(--fd-exec-fill);stroke:var(--fd-exec-stroke)}
.trust{fill:var(--fd-trust-fill);stroke:var(--fd-trust-stroke)}
.learn{fill:var(--fd-learn-fill);stroke:var(--fd-learn-stroke)}
.neutral{fill:var(--fd-surface);stroke:var(--fd-muted)}
.human{stroke:var(--fd-human)!important;stroke-width:3.5}
.t-intent{fill:var(--fd-intent-text)}.t-control{fill:var(--fd-control-text)}.t-exec{fill:var(--fd-exec-text)}
.t-trust{fill:var(--fd-trust-text)}.t-learn{fill:var(--fd-learn-text)}.t-human{fill:var(--fd-human)}
.zone{stroke-width:2;rx:10;fill-opacity:var(--fd-tint)}
.zone.dash{stroke-dasharray:8 6}
.fl{fill:none;stroke:var(--fd-ink);stroke-width:2.5;marker-end:url(#m-ink)}
.au{fill:none;stroke:var(--fd-control-stroke);stroke-width:3;marker-end:url(#m-au)}
.ev{fill:none;stroke:var(--fd-trust-stroke);stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#m-ev)}
.ln{fill:none;stroke:var(--fd-learn-stroke);stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#m-ln)}
.rt{fill:none;stroke:var(--fd-muted);stroke-width:2;stroke-dasharray:5 5;marker-end:url(#m-mu)}
.thin{stroke-width:1.5}
.nomk{marker-end:none}
.dot{fill:var(--fd-trust-stroke)}
.lbg{fill:var(--fd-paper);stroke:none}
.chip{stroke-width:2;rx:14}
.mk-ink{fill:var(--fd-ink)}.mk-au{fill:var(--fd-control-stroke)}.mk-ev{fill:var(--fd-trust-stroke)}
.mk-ln{fill:var(--fd-learn-stroke)}.mk-mu{fill:var(--fd-muted)}
.hair{stroke:var(--fd-line);stroke-width:1.5;fill:none}
.x{stroke:var(--fd-human);stroke-width:3;fill:none}
</style>
<defs>
<marker id="m-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="mk-ink" d="M0,1 L11,6 L0,11 z"/></marker>
<marker id="m-au" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="mk-au" d="M0,1 L11,6 L0,11 z"/></marker>
<marker id="m-ev" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="mk-ev" d="M0,1 L11,6 L0,11 z"/></marker>
<marker id="m-ln" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="mk-ln" d="M0,1 L11,6 L0,11 z"/></marker>
<marker id="m-mu" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="mk-mu" d="M0,1 L11,6 L0,11 z"/></marker>
</defs>
<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">What is an Autonomous Software Factory</text>
<text x="60" y="108" class="sub">A governed production system that converts intent into independently verified software outcomes</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D01</text></g>
<g id="builder">
<rect x="60" y="300" width="230" height="64" class="box neutral human"/>
<text x="175.0" y="329.9" class="h c">Builder</text>
<text x="175.0" y="349.9" class="xs c">human · owns the outcome</text>
</g>
<path id="a-builder-intent" d="M175,364 L175,410" class="fl"/>
<g id="intent">
<rect x="60" y="410" width="230" height="120" class="box intent"/>
<text x="175.0" y="457.5" class="h t-intent c">Intent</text>
<text x="175.0" y="478.5" class="s c">outcome · constraints</text>
<text x="175.0" y="498.0" class="s c">owner · risk · budget</text>
</g>
<g id="control-plane">
<rect x="380" y="150" width="840" height="100" class="box control"/>
<text x="800.0" y="187.5" class="h t-control c">Control Plane — durable system of record</text>
<text x="800.0" y="208.5" class="s c">identity · delegated authority · policy · budgets · routing · state · registries</text>
<text x="800.0" y="228.0" class="s c">evidence requirements · decisions · emergency control</text>
</g>
<g id="factory"><rect x="380" y="330" width="840" height="320" class="zone exec"/><text x="396" y="356" class="h3 t-exec">AI Software Factory — one Active Factory Version, immutable and qualified for its scope</text></g>
<g id="plan">
<rect x="400" y="385" width="185" height="110" class="box intent"/>
<text x="492.5" y="427.5" class="h t-intent c">Plan</text>
<text x="492.5" y="448.5" class="s c">Work Graph</text>
<text x="492.5" y="468.0" class="s c">Work Orders</text>
</g>
<path id="a-plan" d="M585,440 L605,440" class="fl"/>
<g id="route">
<rect x="605" y="385" width="185" height="110" class="box control"/>
<text x="697.5" y="427.5" class="h t-control c">Route</text>
<text x="697.5" y="448.5" class="s c">qualified Factory</text>
<text x="697.5" y="468.0" class="s c">Version + profile</text>
</g>
<path id="a-route" d="M790,440 L810,440" class="fl"/>
<g id="execute">
<rect x="810" y="385" width="185" height="110" class="box exec"/>
<text x="902.5" y="427.5" class="h t-exec c">Execute</text>
<text x="902.5" y="448.5" class="s c">Attempt in a sandbox</text>
<text x="902.5" y="468.0" class="s c">Candidate + Evidence</text>
</g>
<path id="a-execute" d="M995,440 L1015,440" class="fl"/>
<g id="verify">
<rect x="1015" y="385" width="185" height="110" class="box trust"/>
<text x="1107.5" y="427.5" class="h t-trust c">Verify</text>
<text x="1107.5" y="448.5" class="s c">independent</text>
<text x="1107.5" y="468.0" class="s c">Verification Attempt</text>
</g>
<text x="400" y="560" class="s">composes agents · models · skills · tools · context · harnesses · execution environments</text>
<text x="400" y="584" class="s">verification · evidence · policy · human authority · delivery · learning — more durable than any model inside it</text>
<text x="400" y="616" class="xs">Plan · Route · Execute · Verify are Delivery Loop steps 3–6; Receive and Specify precede them, Approve · Release · Observe · Learn follow.</text>
<path id="a-authority" d="M700,250 L700,330" class="au"/>
<rect x="500.7" y="284.1" width="145.3" height="17.5" class="lbg" rx="3"/>
<text x="640" y="296" class="label r">authority flows down</text>
<path id="a-evidence" d="M900,330 L900,250" class="ev"/>
<rect x="954.0" y="284.1" width="143.3" height="17.5" class="lbg" rx="3"/>
<text x="960" y="296" class="label">evidence flows back</text>
<path id="a-intent-factory" d="M290,470 L380,470" class="fl"/>
<text x="335" y="455" class="xs c">Receive</text>
<text x="335" y="493" class="xs c">Specify</text>
<path id="a-verify-evidence" d="M1220,440 L1260,440 L1260,380 L1300,380" class="fl"/>
<g id="evidence">
<rect x="1300" y="340" width="240" height="80" class="box trust"/>
<text x="1420.0" y="377.9" class="h t-trust c">Evidence</text>
<text x="1420.0" y="397.9" class="xs c">bound to the exact candidate</text>
</g>
<path id="a-evidence-decision" d="M1420,420 L1420,460" class="fl"/>
<g id="decision">
<rect x="1300" y="460" width="240" height="96" class="box trust human"/>
<text x="1420.0" y="496.8" class="h t-trust c">Decision</text>
<text x="1420.0" y="516.8" class="xs c">human or policy authority</text>
<text x="1420.0" y="535.0" class="xs c">at the risk tier</text>
</g>
<path id="a-decision-outcome" d="M1420,556 L1420,596" class="fl"/>
<g id="outcome">
<rect x="1300" y="596" width="240" height="80" class="box trust"/>
<text x="1420.0" y="633.9" class="h t-trust c">Verified outcome</text>
<text x="1420.0" y="653.9" class="xs c">accepted · released · observed</text>
</g>
<path id="a-learn" d="M1420,676 L1420,722 L800,722 L800,650" class="ln"/>
<rect x="661.5" y="736.1" width="897.1" height="17.5" class="lbg" rx="3"/>
<text x="1110" y="748" class="label c">Observe → Learn: Outcome → Learning Signal → Improvement Candidate → next Factory Version (governed promotion, never a live mutation)</text>
<text x="60" y="796" class="h">Coding Agent ≠ AI Software Factory.</text>
<text x="60" y="822" class="s">The model proposes. The system decides what becomes real. Verified delivery, not merely generated code.</text>
<g id="legend">
<rect x="60" y="847" width="26" height="16" class="box intent" rx="3"/>
<text x="94" y="860" class="xs">Intent</text>
<rect x="155.28" y="847" width="26" height="16" class="box control" rx="3"/>
<text x="189.28" y="860" class="xs">Control</text>
<rect x="260.08000000000004" y="847" width="26" height="16" class="box exec" rx="3"/>
<text x="294.08000000000004" y="860" class="xs">Execution</text>
<rect x="383.36000000000007" y="847" width="26" height="16" class="box trust" rx="3"/>
<text x="417.36000000000007" y="860" class="xs">Trust</text>
<rect x="476.4000000000001" y="847" width="26" height="16" class="box learn" rx="3"/>
<text x="510.4000000000001" y="860" class="xs">Learning</text>
<rect x="592.1200000000001" y="847" width="26" height="16" class="box neutral human" rx="3"/>
<text x="626.1200000000001" y="860" class="xs">Human authority</text>
<path d="M765.1600000000001,855 L809.1600000000001,855" class="au"/><text x="819.1600000000001" y="860" class="xs">authority / flow (solid)</text>
<path d="M987.4000000000001,855 L1031.4,855" class="ev"/><text x="1041.4" y="860" class="xs">evidence (dashed, back)</text>
<path d="M1221.1200000000001,855 L1265.1200000000001,855" class="ln"/><text x="1275.1200000000001" y="860" class="xs">learning (dashed)</text>
</g>
</svg>
