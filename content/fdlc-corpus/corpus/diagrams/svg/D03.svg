<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D03 d-D03">
<title id="t-D03">The Factory Lifecycle</title>
<desc id="d-D03">The eight-stage Factory Lifecycle, the outer loop of FDLC: Discover, Define, Design, Assemble, Qualify, Deploy, Operate, Improve. Each stage names its purpose and output artifact. Qualify may reject a candidate back to Assemble; Operate may suspend or restrict a version, returning to Deploy for restoration; Improve produces a candidate Factory Version that re-enters Qualify. A strip below shows the Factory Version states produced along the way: Draft, Candidate, Qualified, Active, Restricted or Suspended, Deprecated, Retired.</desc>
<style>
svg.fd{--fd-paper:#f3f1ea;--fd-surface:#faf9f5;--fd-ink:#171a18;--fd-muted:#59605a;--fd-line:#c9ccc4;
--fd-intent-fill:#dce8ef;--fd-intent-stroke:#2f5f78;--fd-intent-text:#1f4557;
--fd-control-fill:#e4e9ec;--fd-control-stroke:#4a5d68;--fd-control-text:#2f3f47;
--fd-exec-fill:#f5e6d0;--fd-exec-stroke:#9a4f1c;--fd-exec-text:#6b3612;
--fd-trust-fill:#dcefe4;--fd-trust-stroke:#1a654b;--fd-trust-text:#114735;
--fd-learn-fill:#e9e2f4;--fd-learn-stroke:#5c3f8f;--fd-learn-text:#3f2a66;
--fd-human:#b3261e;--fd-tint:.45}
@media (prefers-color-scheme:dark){svg.fd{--fd-paper:#15191b;--fd-surface:#1d2326;--fd-ink:#ecebe4;--fd-muted:#a8b0aa;--fd-line:#3b433d;
--fd-intent-fill:#1c3140;--fd-intent-stroke:#8ec1dc;--fd-intent-text:#cfe6f2;
--fd-control-fill:#2a3438;--fd-control-stroke:#a8bcc6;--fd-control-text:#dbe5ea;
--fd-exec-fill:#3b2812;--fd-exec-stroke:#e2a468;--fd-exec-text:#f5dcc0;
--fd-trust-fill:#143326;--fd-trust-stroke:#7fd2a6;--fd-trust-text:#cdeedb;
--fd-learn-fill:#2b2142;--fd-learn-stroke:#bfa5ea;--fd-learn-text:#e3d8f5;
--fd-human:#ff8a80;--fd-tint:.35}}
.bg{fill:var(--fd-paper)}
text{font-family:"Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fd-ink);font-size:16px}
.mono{font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace}
.title{font-size:34px;font-weight:600}
.sub{font-size:18px;fill:var(--fd-muted)}
.h{font-size:20px;font-weight:600}.h2{font-size:18px;font-weight:600}.h3{font-size:16px;font-weight:600}
.b{font-size:16px}.s{font-size:15px;fill:var(--fd-muted)}.xs{font-size:14px;fill:var(--fd-muted)}
.i{font-style:italic}.c{text-anchor:middle}.r{text-anchor:end}.strong{font-weight:600}
.label{font-size:14px;fill:var(--fd-muted)}
.tag{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;fill:var(--fd-muted)}
.box{stroke-width:2;rx:6}
.intent{fill:var(--fd-intent-fill);stroke:var(--fd-intent-stroke)}
.control{fill:var(--fd-control-fill);stroke:var(--fd-control-stroke)}
.exec{fill:var(--fd-exec-fill);stroke:var(--fd-exec-stroke)}
.trust{fill:var(--fd-trust-fill);stroke:var(--fd-trust-stroke)}
.learn{fill:var(--fd-learn-fill);stroke:var(--fd-learn-stroke)}
.neutral{fill:var(--fd-surface);stroke:var(--fd-muted)}
.human{stroke:var(--fd-human)!important;stroke-width:3.5}
.t-intent{fill:var(--fd-intent-text)}.t-control{fill:var(--fd-control-text)}.t-exec{fill:var(--fd-exec-text)}
.t-trust{fill:var(--fd-trust-text)}.t-learn{fill:var(--fd-learn-text)}.t-human{fill:var(--fd-human)}
.zone{stroke-width:2;rx:10;fill-opacity:var(--fd-tint)}
.zone.dash{stroke-dasharray:8 6}
.fl{fill:none;stroke:var(--fd-ink);stroke-width:2.5;marker-end:url(#m-ink)}
.au{fill:none;stroke:var(--fd-control-stroke);stroke-width:3;marker-end:url(#m-au)}
.ev{fill:none;stroke:var(--fd-trust-stroke);stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#m-ev)}
.ln{fill:none;stroke:var(--fd-learn-stroke);stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#m-ln)}
