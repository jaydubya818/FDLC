<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D09 d-D09">
<title id="t-D09">Multi-Factory Orchestration — SSO Example</title>
<desc id="d-D09">A Builder owns Objective INT-100, 'Add SSO to the customer portal'. Inside the enterprise control plane, the Objective Planner (Level 1 routing) produces Plan PLAN-100-r1 with three Work Orders; the Factory Router (Level 2) consults the Factory Registry and binds each Work Order to a qualified Factory Version. WO-101 Backend and WO-102 Frontend go to the Code Generation Factory FV-codegen-2.3; WO-103 Security goes to the Security Remediation Factory FV-secrem-1.4. Factories never orchestrate one another. Their Candidates and Evidence flow (dashed) to a join that forms the integrated Candidate, then to Integration V&amp;V, a human acceptance Decision at the High tier, and Release REL-100, whose Outcome flows back to the Objective.</desc>
<style>
