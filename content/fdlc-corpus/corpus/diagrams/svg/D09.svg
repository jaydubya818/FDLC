<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">Multi-Factory Orchestration — SSO Example</text>
<text x="60" y="108" class="sub">The control plane orchestrates the objective. Factories execute bounded work. Factories do not orchestrate one another.</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D09</text></g>
<g id="builder">
<rect x="60" y="150" width="300" height="56" class="box neutral human"/>
<text x="210.0" y="183.6" class="h3 c">Builder — owns the Objective</text>
</g>
<path id="a-builder-obj" d="M210,206 L210,240" class="fl"/>
<g id="objective">
<rect x="60" y="240" width="300" height="100" class="box intent"/>
<text x="210.0" y="278.1" class="h t-intent c">Objective INT-100</text>
<text x="210.0" y="299.1" class="s i c">“Add SSO to the customer portal”</text>
<text x="210.0" y="317.6" class="xs c">risk tier: High · budget · stop condition</text>
</g>
<g id="control-plane"><rect x="400" y="150" width="1140" height="190" class="zone control"/><text x="416" y="176" class="h3 t-control">Enterprise Control Plane — identity · policy · registries · routing · decisions · evidence</text></g>
<g id="objective-planner">
<rect x="420" y="200" width="250" height="120" class="box control"/>
<text x="545.0" y="248.1" class="h2 t-control c">Objective Planner</text>
<text x="545.0" y="267.5" class="xs c">Level 1 · Objective routing</text>
<text x="545.0" y="285.7" class="xs c">capabilities → factory set</text>
</g>
<g id="plan">
<rect x="700" y="200" width="290" height="120" class="box intent"/>
<text x="845.0" y="248.1" class="h2 t-intent c">Plan PLAN-100-r1</text>
<text x="845.0" y="267.5" class="xs c">Work Orders · dependency graph</text>
<text x="845.0" y="285.7" class="xs c">budgets · verification strategy</text>
</g>
<g id="factory-router">
<rect x="1020" y="200" width="240" height="120" class="box control"/>
<text x="1140.0" y="248.1" class="h2 t-control c">Factory Router</text>
<text x="1140.0" y="267.5" class="xs c">Level 2 · Work Order routing</text>
<text x="1140.0" y="285.7" class="xs c">eligibility → ranking</text>
</g>
<g id="factory-registry">
<rect x="1290" y="200" width="230" height="120" class="box control"/>
<text x="1405.0" y="248.1" class="h2 t-control c">Factory Registry</text>
<text x="1405.0" y="267.5" class="xs c">capabilities · versions</text>
<text x="1405.0" y="285.7" class="xs c">qualification scopes</text>
</g>
<path id="a-obj-planner" d="M360,290 L420,290" class="fl"/>
<path id="a-planner-plan" d="M670,260 L700,260" class="fl"/>
<path id="a-plan-router" d="M990,260 L1020,260" class="fl"/>
<path id="a-registry-router" d="M1290,260 L1260,260" class="fl"/>
<g id="wo-101">
<rect x="400" y="410" width="220" height="90" class="box intent"/>
<text x="510.0" y="452.2" class="h2 t-intent c">WO-101 Backend</text>
<text x="510.0" y="471.6" class="xs c">OIDC + session model</text>
</g>
<path id="a-router-wo-101" d="M1140,320 L510,410" class="au"/>
<g id="wo-102">
<rect x="640" y="410" width="220" height="90" class="box intent"/>
<text x="750.0" y="452.2" class="h2 t-intent c">WO-102 Frontend</text>
<text x="750.0" y="471.6" class="xs c">login flow + token handling</text>
</g>
<path id="a-router-wo-102" d="M1140,320 L750,410" class="au"/>
<g id="wo-103">
<rect x="880" y="410" width="220" height="90" class="box intent"/>
<text x="990.0" y="452.2" class="h2 t-intent c">WO-103 Security</text>
<text x="990.0" y="471.6" class="xs c">threat model + scans + policy</text>
</g>
<path id="a-router-wo-103" d="M1140,320 L990,410" class="au"/>
<text x="1165" y="362" class="label">routing Decisions bind each Work Order</text>
<text x="1165" y="380" class="label">to a qualified Factory Version + profile</text>
<g id="factory-codegen">
<rect x="400" y="560" width="460" height="130" class="box exec"/>
<text x="630.0" y="613.1" class="h t-exec c">Code Generation Factory</text>
<text x="630.0" y="634.1" class="s c">FV-codegen-2.3 · executes WO-101 and WO-102</text>
<text x="630.0" y="652.6" class="xs c">sandboxed Attempts → Candidates + Evidence</text>
</g>
<g id="factory-secrem">
<rect x="880" y="560" width="220" height="130" class="box exec"/>
<text x="990.0" y="611.8" class="h2 t-exec c">Security Remediation</text>
<text x="990.0" y="633.2" class="h3 t-exec c">Factory FV-secrem-1.4</text>
<text x="990.0" y="652.0" class="xs c">executes WO-103</text>
</g>
<path id="a-wo101-f1" d="M510,500 L510,560" class="fl"/>
<path id="a-wo102-f1" d="M750,500 L750,560" class="fl"/>
<path id="a-wo103-f2" d="M990,500 L990,560" class="fl"/>
<g id="no-peer-orchestration"><path d="M860,625 L880,625" class="hair"/><path d="M862,617 L878,633 M878,617 L862,633" class="x"/></g>
<text x="750" y="726" class="xs c">Factories do not orchestrate one another — the control plane orchestrates the objective.</text>
<path id="a-f1-join" d="M820,560 L820,530 L1120,530 L1120,445 L1140,445" class="ev"/>
<path id="a-f2-join" d="M1100,600 L1120,600 L1120,536" class="ev nomk"/>
<circle cx="1120" cy="530" r="5" class="dot"/>
<rect x="881.1" y="510.1" width="157.9" height="17.5" class="lbg" rx="3"/>
<text x="960" y="522" class="label c">Candidates + Evidence</text>
<g id="join">
<rect x="1140" y="410" width="400" height="70" class="box trust"/>
<text x="1340.0" y="442.2" class="h2 t-trust c">Join: integrated Candidate</text>
<text x="1340.0" y="461.6" class="xs c">exact commits · tree · diff hashes across Work Orders</text>
</g>
<path id="a-join-iv" d="M1340,480 L1340,500" class="fl"/>
<g id="integration-vv">
<rect x="1140" y="500" width="400" height="80" class="box trust"/>
<text x="1340.0" y="537.2" class="h2 t-trust c">Integration V&amp;V</text>
<text x="1340.0" y="556.6" class="xs c">Objective-level · separate Verification Attempt</text>
</g>
<path id="a-iv-dec" d="M1340,580 L1340,600" class="fl"/>
<g id="decision">
<rect x="1140" y="600" width="400" height="80" class="box trust human"/>
<text x="1340.0" y="637.2" class="h2 t-trust c">Decision: acceptance</text>
<text x="1340.0" y="656.6" class="xs c">human authority · High risk tier</text>
</g>
<path id="a-dec-rel" d="M1340,680 L1340,700" class="fl"/>
<g id="release">
<rect x="1140" y="700" width="400" height="70" class="box trust"/>
<text x="1340.0" y="732.2" class="h2 t-trust c">Release REL-100</text>
<text x="1340.0" y="751.6" class="xs c">release-authorization · rollback ready</text>
</g>
<path id="a-outcome" d="M1140,750 L1110,750 L1110,800 L210,800 L210,340" class="ev"/>
<rect x="351.3" y="806.1" width="617.4" height="17.5" class="lbg" rx="3"/>
<text x="660" y="818" class="label c">Outcome OUT-100 observed over a window and attributed to the Objective → Learning Signals</text>
<g id="legend">
<rect x="60" y="847" width="26" height="16" class="box intent" rx="3"/>
<text x="94" y="860" class="xs">Intent</text>
<rect x="155.28" y="847" width="26" height="16" class="box control" rx="3"/>
<text x="189.28" y="860" class="xs">Control</text>
<rect x="260.08000000000004" y="847" width="26" height="16" class="box exec" rx="3"/>
<text x="294.08000000000004" y="860" class="xs">Execution</text>
<rect x="383.36000000000007" y="847" width="26" height="16" class="box trust" rx="3"/>
<text x="417.36000000000007" y="860" class="xs">Trust</text>
<rect x="476.4000000000001" y="847" width="26" height="16" class="box learn" rx="3"/>
<text x="510.4000000000001" y="860" class="xs">Learning</text>
<rect x="592.1200000000001" y="847" width="26" height="16" class="box neutral human" rx="3"/>
<text x="626.1200000000001" y="860" class="xs">Human authority</text>
<path d="M765.1600000000001,855 L809.1600000000001,855" class="au"/><text x="819.1600000000001" y="860" class="xs">authority / flow (solid)</text>
<path d="M987.4000000000001,855 L1031.4,855" class="ev"/><text x="1041.4" y="860" class="xs">evidence (dashed, back)</text>
<path d="M1221.1200000000001,855 L1265.1200000000001,855" class="ln"/><text x="1275.1200000000001" y="860" class="xs">learning (dashed)</text>
</g>
</svg>
