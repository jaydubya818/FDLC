<g id="tile-note">
<rect x="590" y="640" width="510" height="108" class="box neutral"/>
<text x="845.0" y="681.4" class="h3 c">14 pinned identities, one digest</text>
<text x="845.0" y="700.2" class="xs c">Retries, restoration, and audit all resolve</text>
<text x="845.0" y="718.4" class="xs c">to exactly this composition</text>
</g>
<g id="why-immutable"><rect x="1140" y="140" width="400" height="330" class="zone neutral"/></g>
<text x="1160" y="170" class="h3">Why mutable configuration cannot be governed</text>
<text x="1160" y="204" class="s">✕  no attributable behavior — which composition ran?</text>
<text x="1160" y="234" class="s">✕  no reproducible evidence</text>
<text x="1160" y="264" class="s">✕  no safe rollback target</text>
<text x="1160" y="294" class="s">✕  silent authority widening</text>
<text x="1160" y="324" class="s">✕  unauditable learning</text>
<text x="1160" y="354" class="s">✕  cross-tenant blast radius</text>
<text x="1160" y="400" class="h3">Qualification is scoped:</text>
<text x="1160" y="424" class="xs">workload class × environment × risk tier × autonomy level</text>
<text x="1160" y="446" class="xs">fail-closed: a hard gate with unknown evidence fails</text>
<g id="states"><rect x="1140" y="500" width="400" height="270" class="zone control"/><text x="1156" y="526" class="tag t-control">Factory Version states (D12)</text></g>
<g id="state-draft"><rect x="1160" y="540" width="220" height="40" class="chip exec"/><text x="1270.0" y="565.5" class="h3 c ">Draft</text></g>
<path id="a-state-0" d="M1270,580 L1270,596" class="fl thin"/>
