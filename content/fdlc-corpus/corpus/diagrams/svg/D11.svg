<g id="state-qualified"><rect x="1160" y="652" width="220" height="40" class="chip trust"/><text x="1270.0" y="677.5" class="h3 c ">Qualified (scope)</text></g>
<path id="a-state-2" d="M1270,692 L1270,708" class="fl thin"/>
<g id="state-active"><rect x="1160" y="708" width="220" height="40" class="chip trust human"/><text x="1270.0" y="733.5" class="h3 c ">Active (environment)</text></g>
<text x="1395" y="566" class="xs">Assemble</text>
<text x="1395" y="622" class="xs">digest fixed</text>
<text x="1395" y="678" class="xs">Qualification Record</text>
<text x="1395" y="734" class="xs">Decision: promotion</text>
<text x="60" y="812" class="xs">Composition change → new Factory Version → Qualify → Decision (promotion) → Active. Restoration targets a separately identified previous version.</text>
