<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">Factory Version Composition</text>
<text x="60" y="108" class="sub">Production routes work to a qualified immutable Factory Version, never to a mutable factory</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D11</text></g>
<g id="factory-version">
<rect x="60" y="140" width="1040" height="92" class="box control"/>
<text x="580.0" y="174.2" class="h t-control c">Factory Version FV-depmod-1.0</text>
<text x="580.0" y="195.2" class="s c">immutable · content-addressed · digest = SHA-256 over the JCS-canonicalized manifest</text>
<text x="580.0" y="213.7" class="xs c">qualified per scope · activated per environment · any change = a new version</text>
</g>
