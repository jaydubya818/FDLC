<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D11 d-D11">
<title id="t-D11">Factory Version Composition</title>
<desc id="d-D11">A Factory Version, shown as an immutable, content-addressed manifest card for FV-depmod-1.0, composed of fourteen pinned components arranged as tiles: Planner version; Agent Definitions; Harness versions; Skills; Tools with grants; Model routes; Context configuration; Runtime artifact and Sandbox image; Network, credential and filesystem policy; Verification contract; Approval policy; Execution Profiles; Economics; Qualification evidence. A side panel explains why mutable configuration cannot be governed and shows the states Draft, Candidate, Qualified, Active.</desc>
