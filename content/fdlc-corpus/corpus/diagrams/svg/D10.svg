<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D10 d-D10">
<title id="t-D10">Three-Level Routing</title>
<desc id="d-D10">Three horizontal bands. Level 1, Objective routing, owned by the Objective Planner in the control plane: an Objective becomes required capabilities, a factory set, and a dependency graph across Work Orders. Level 2, Work Order routing, owned by the Factory Router: a Work Order passes an eligibility filter (policy, authorization, compatibility, qualification, authority) before ranking by evidence (quality, reliability, latency, cost per verified outcome), producing a qualified Factory Version plus Execution Profile; an empty eligible set blocks or escalates and never relaxes a gate; scheduling is a separate decision. Level 3, Task routing, owned by the Capability Router inside the factory: a Task is bound to a model route, skill, tool, runtime, sandbox and provider within the Execution Profile's admitted set, producing an Attempt with a frozen routing snapshot.</desc>
<style>
