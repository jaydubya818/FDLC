<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">Agent, Skill, Tool, Harness, Factory</text>
<text x="60" y="108" class="sub">A Tool acts · a Skill packages a method · an Agent pursues a goal · a Harness is the envelope · a Factory turns intent into verified outcomes</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D19</text></g>
<g id="ecosystem"><rect x="60" y="135" width="1480" height="625" class="zone control dash"/><text x="76" y="161" class="h3 t-control">Factory Ecosystem — many factories under one enterprise control plane</text></g>
<g id="control-plane">
<rect x="80" y="172" width="1440" height="56" class="box control"/>
<text x="800.0" y="205.6" class="h3 t-control c">Control Plane — identity · authority · policy · budgets · state · registries · decisions · emergency control</text>
</g>
<g id="factory"><rect x="80" y="262" width="1420" height="480" class="zone exec"/><text x="96" y="288" class="h3 t-exec">Factory — one immutable Factory Version FV-… (agents, skills, tools, routes, runtime, sandbox, verification, policy)</text></g>
<g id="orchestrator">
<rect x="100" y="300" width="230" height="130" class="box control"/>
<text x="215.0" y="344.0" class="h2 t-control c">Orchestrator</text>
<text x="215.0" y="363.4" class="xs c">advances the Work Graph</text>
<text x="215.0" y="381.6" class="xs c">across agents, deterministic</text>
<text x="215.0" y="399.8" class="xs c">steps, and human waits</text>
</g>
<g id="runtime"><rect x="360" y="300" width="760" height="420" class="zone exec dash"/><text x="376" y="326" class="h3 t-exec">Runtime — process lifecycle · leases · persistence · resume</text></g>
<g id="sandbox"><rect x="384" y="340" width="712" height="360" class="zone exec dash"/><text x="400" y="366" class="h3 t-exec">Sandbox — filesystem · process · network · credentials · resources</text></g>
<g id="harness"><rect x="408" y="380" width="664" height="300" class="zone exec"/><text x="424" y="406" class="h3 t-exec">Harness — operating envelope + loop controls for ONE agent</text></g>
<g id="agent">
<rect x="432" y="418" width="300" height="110" class="box exec"/>
<text x="582.0" y="461.8" class="h t-exec c">Agent</text>
<text x="582.0" y="481.8" class="xs c">reasoning + goal + tools</text>
<text x="582.0" y="500.0" class="xs c">+ context + working state</text>
</g>
<g id="harness-note">
<rect x="756" y="418" width="292" height="110" class="box neutral"/>
<text x="902.0" y="451.3" class="h3 c">The Harness enforces locally:</text>
<text x="902.0" y="470.1" class="xs c">budgets · stopping · recovery</text>
<text x="902.0" y="488.3" class="xs c">telemetry · policy checks — never</text>
<text x="902.0" y="506.5" class="xs c">enterprise authority</text>
</g>
<g id="agent-loop">
<rect x="432" y="552" width="616" height="100" class="box exec"/>
<text x="740.0" y="589.4" class="h2 t-exec c">Agent Loop</text>
<text x="740.0" y="609.9" class="s c">load → select → act → observe → evaluate → replan → stop</text>
<text x="740.0" y="628.4" class="xs c">runs inside one Work Graph node</text>
</g>
<g id="skills">
<rect x="1200" y="372" width="280" height="60" class="box exec"/>
<text x="1340.0" y="399.2" class="h2 t-exec c">Skills</text>
<text x="1340.0" y="418.6" class="xs c">versioned procedures loaded in context</text>
</g>
<path id="a-harness-skills" d="M1072,402 L1200,402" class="fl"/>
<text x="1160" y="394" class="label c">loads</text>
<g id="tools">
<rect x="1200" y="444" width="280" height="60" class="box exec"/>
<text x="1340.0" y="471.2" class="h2 t-exec c">Tools</text>
<text x="1340.0" y="490.6" class="xs c">capabilities invoked under a grant</text>
</g>
<path id="a-harness-tools" d="M1072,474 L1200,474" class="fl"/>
<text x="1160" y="466" class="label c">invokes</text>
<g id="model">
<rect x="1200" y="516" width="280" height="60" class="box exec"/>
<text x="1340.0" y="543.2" class="h2 t-exec c">Model</text>
<text x="1340.0" y="562.6" class="xs c">inference resource — replaceable</text>
</g>
<path id="a-harness-model" d="M1072,546 L1200,546" class="fl"/>
<text x="1160" y="538" class="label c">calls</text>
<g id="context-package">
<rect x="1200" y="588" width="280" height="60" class="box exec"/>
<text x="1340.0" y="615.2" class="h2 t-exec c">Context Package</text>
<text x="1340.0" y="634.6" class="xs c">frozen · advisory · never evidence</text>
</g>
<path id="a-context-package-harness" d="M1200,618 L1072,618" class="fl"/>
<text x="1160" y="610" class="label c">frozen in</text>
<g id="verifier">
<rect x="1200" y="672" width="280" height="60" class="box trust"/>
<text x="1340.0" y="699.2" class="h2 t-trust c">Verifier</text>
<text x="1340.0" y="718.6" class="xs c">independent Verification Attempt</text>
</g>
<path id="a-cp-orch" d="M215,228 L215,300" class="au"/>
<text x="228" y="250" class="label">authorizes an Execution Profile</text>
<path id="a-orch-harness" d="M215,430 L215,470 L408,470" class="fl"/>
<text x="110" y="494" class="label">dispatches one Work Graph node</text>
<path id="a-harness-verifier" d="M1072,664 L1200,702" class="ev"/>
<text x="1152" y="662" class="label c">Candidate + Evidence</text>
<path id="a-verifier-cp" d="M1480,702 L1512,702 L1512,228" class="ev"/>
<text x="1500" y="250" class="label r">verification result → control plane</text>
<text x="60" y="790" class="xs">A Tool acts. A Skill packages a method. An Agent pursues a goal; its Agent Loop is how it makes progress. The Harness is the envelope it operates in. The Orchestrator advances work across agents and time.</text>
<text x="60" y="812" class="xs">The Runtime hosts execution. The Sandbox contains its effects. The Factory is the governed system that turns intent into verified outcomes. Categorize by responsibility at the boundary, not by marketing name.</text>
