<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D19 d-D19">
<title id="t-D19">Agent, Skill, Tool, Harness, Factory</title>
<desc id="d-D19">Nested containment diagram. The Factory Ecosystem contains a Control Plane band and a Factory. Inside the Factory: an Orchestrator advances the Work Graph; a Runtime hosts execution; inside it a Sandbox isolates effects; inside that a Harness bounds exactly one Agent and its Agent Loop (load, select, act, observe, evaluate, replan, stop). To the right, inside the Factory, sit Skills (loaded), Tools (invoked under a grant), Model (called), Context Package (frozen into the Attempt), and the Verifier, an independent Verification Attempt. Solid arrows show the control plane authorizing an Execution Profile and the Orchestrator dispatching one Work Graph node; dashed arrows carry Candidate plus Evidence to the Verifier and the verification result back to the control plane.</desc>
