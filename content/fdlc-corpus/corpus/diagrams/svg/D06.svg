<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">Reference Architecture — Twelve Layers in Four Planes</text>
<text x="60" y="108" class="sub">Authority flows down from the control plane; evidence flows back. Intelligence may vary; authority must stay bounded and explicit.</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D06</text></g>
<g id="plane-I"><rect x="160" y="135" width="1080" height="132" class="zone intent"/></g>
<text x="176" y="155" class="tag t-intent">Plane I — Intent</text>
<g id="layer-L1"><rect x="172" y="163" width="1056" height="44" class="box intent"/><text x="186" y="191" class="h2 t-intent">L1 Experience</text><text x="450" y="190" class="xs">Builder UI · CLI · IDE · API · issue trackers · webhook intake — never holds authority in the client</text></g>
<g id="layer-L2"><rect x="172" y="211" width="1056" height="44" class="box intent"/><text x="186" y="239" class="h2 t-intent">L2 Intent &amp; Planning</text><text x="450" y="238" class="xs">Intent · Specification · Objective Planner · Plan · Work Graph · Work Orders</text></g>
<g id="plane-II"><rect x="160" y="275" width="1080" height="132" class="zone control"/></g>
<text x="176" y="295" class="tag t-control">Plane II — Control</text>
<g id="layer-L3"><rect x="172" y="303" width="1056" height="44" class="box control"/><text x="186" y="331" class="h2 t-control">L3 Control Plane</text><text x="450" y="330" class="xs">Identity · Authority · Policy · Budgets · State · Factory Registry · Capability Registry · Incident Command</text></g>
<g id="layer-L4"><rect x="172" y="351" width="1056" height="44" class="box control"/><text x="186" y="379" class="h2 t-control">L4 Routing &amp; Orchestration</text><text x="450" y="378" class="xs">Objective → Work Order → Task routing · Factory Versions · Execution Profiles · Orchestrator · Scheduling · Leases</text></g>
<g id="plane-III"><rect x="160" y="415" width="1080" height="180" class="zone exec"/></g>
<text x="176" y="435" class="tag t-exec">Plane III — Execution</text>
<g id="layer-L5"><rect x="172" y="443" width="1056" height="44" class="box exec"/><text x="186" y="471" class="h2 t-exec">L5 Agent &amp; Harness</text><text x="450" y="470" class="xs">Agents · Agent Loop · Harness · Skills · Tools · Agentic SDKs · Model routes</text></g>
<g id="layer-L6"><rect x="172" y="491" width="1056" height="44" class="box exec"/><text x="186" y="519" class="h2 t-exec">L6 Context &amp; Knowledge</text><text x="450" y="518" class="xs">Retrieval · Assembly · Context Policy · Provenance · Freshness · Authorization</text></g>
<g id="layer-L7"><rect x="172" y="539" width="1056" height="44" class="box exec"/><text x="186" y="567" class="h2 t-exec">L7 Execution Environment</text><text x="450" y="566" class="xs">Runtime · Sandboxes · Compute · Network · Credentials · Artifact extraction</text></g>
<g id="plane-IV"><rect x="160" y="603" width="1080" height="180" class="zone trust"/></g>
<text x="176" y="623" class="tag t-trust">Plane IV — Trust</text>
<g id="layer-L8"><rect x="172" y="631" width="1056" height="44" class="box trust"/><text x="186" y="659" class="h2 t-trust">L8 Verification</text><text x="450" y="658" class="xs">Tests · Static/dynamic analysis · Security · Policy checks · AI evaluators · Independent verifier Attempts · Human review</text></g>
<g id="layer-L9"><rect x="172" y="679" width="1056" height="44" class="box trust"/><text x="186" y="707" class="h2 t-trust">L9 Evidence &amp; Provenance</text><text x="450" y="706" class="xs">Artifacts · Traces · Receipts · Provenance · Currentness · Evidence store</text></g>
<g id="layer-L10"><rect x="172" y="727" width="1056" height="44" class="box trust"/><text x="186" y="755" class="h2 t-trust">L10 Authority &amp; Release</text><text x="450" y="754" class="xs">Decisions · Publication · Promotion · Release · CI/CD and delivery systems</text></g>
<path id="a-authority" d="M112,150 L112,771" class="au"/>
<text x="90" y="480" class="tag c" transform="rotate(-90 90 480)">authority flows down</text>
<path id="a-evidence" d="M1272,771 L1272,150" class="ev"/>
<text x="1294" y="480" class="tag c" transform="rotate(-90 1294 480)">evidence flows back</text>
<g id="cross-cutting"><rect x="1316" y="135" width="224" height="648" class="zone learn"/></g>
<text x="1332" y="156" class="tag t-learn">Cross-cutting</text>
<g id="layer-L11"><rect x="1328" y="170" width="200" height="300" class="box learn"/></g>
<text x="1428" y="200" class="h2 t-learn c">L11 Observability</text>
<text x="1428" y="222" class="h2 t-learn c">&amp; Economics</text>
<text x="1428" y="258" class="xs c">Traces · Quality</text>
<text x="1428" y="280" class="xs c">Cost · Tokens · Latency</text>
<text x="1428" y="302" class="xs c">Reliability</text>
<text x="1428" y="324" class="xs c">Attribution to outcomes</text>
<text x="1428" y="346" class="xs c">and cost cohorts</text>
<g id="layer-L12"><rect x="1328" y="484" width="200" height="287" class="box learn"/></g>
<text x="1428" y="514" class="h2 t-learn c">L12 Learning</text>
<text x="1428" y="550" class="xs c">Outcomes · Signals</text>
<text x="1428" y="572" class="xs c">Evaluation datasets</text>
<text x="1428" y="594" class="xs c">Improvement Candidates</text>
<text x="1428" y="616" class="xs c">Factory evolution —</text>
<text x="1428" y="638" class="xs c">only via governed</text>
<text x="1428" y="660" class="xs c">promotion</text>
<text x="160" y="813" class="xs">Six responsibility areas cut across the layers — Intent · Execution · Capability · Model · Trust · Learning — with Govern · Secure · Observe · Measure as continuous controls (D07).</text>
