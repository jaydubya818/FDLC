<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D06 d-D06">
<title id="t-D06">Reference Architecture — Twelve Layers in Four Planes</title>
<desc id="d-D06">A stacked diagram of the FDLC reference architecture. Plane I Intent holds L1 Experience and L2 Intent &amp; Planning. Plane II Control holds L3 Control Plane and L4 Routing &amp; Orchestration. Plane III Execution holds L5 Agent &amp; Harness, L6 Context &amp; Knowledge, and L7 Execution Environment. Plane IV Trust holds L8 Verification, L9 Evidence &amp; Provenance, and L10 Authority &amp; Release. Two cross-cutting layers, L11 Observability &amp; Economics and L12 Learning, stand beside the stack. A solid arrow on the left shows authority flowing down; a dashed arrow on the right shows evidence flowing back up.</desc>
<style>
