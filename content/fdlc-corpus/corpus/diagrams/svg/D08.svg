<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">The Control Boundary</text>
<text x="60" y="108" class="sub">Allow intelligence to vary. Always bound authority.</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D08</text></g>
<g id="human">
<rect x="60" y="150" width="300" height="110" class="box neutral human"/>
<text x="210.0" y="192.5" class="h c">Human authority</text>
<text x="210.0" y="213.5" class="s c">approves consequential decisions;</text>
<text x="210.0" y="233.0" class="s c">retains override and restoration</text>
</g>
<path id="a-human-cp" d="M360,205 L420,205" class="au"/>
<text x="390" y="190" class="label c">Decision</text>
<g id="control-plane">
<rect x="420" y="150" width="1120" height="130" class="box control"/>
<text x="980.0" y="193.4" class="h t-control c">02 / Factory control plane — the factory governs</text>
<text x="980.0" y="214.4" class="s c">identity · delegated authority · policy · budgets · routing · state · leases · recovery</text>
<text x="980.0" y="233.9" class="s c">evidence requirements · decisions · audit · emergency control</text>
<text x="980.0" y="252.4" class="xs i c">Durable system of record</text>
</g>
<g id="intelligence">
<rect x="60" y="400" width="640" height="200" class="box exec"/>
<text x="380.0" y="468.6" class="h t-exec c">01 / Intelligence supply — models reason, agents act</text>
<text x="380.0" y="489.6" class="s c">models · agents · skills · prompts · tool adapters</text>
<text x="380.0" y="509.1" class="s c">selected per Work Order by capability, quality and risk profile,</text>
<text x="380.0" y="528.6" class="s c">latency, availability, and cost per verified outcome</text>
<text x="380.0" y="547.1" class="xs i c">Replaceable by design</text>
</g>
<g id="execution">
<rect x="900" y="400" width="640" height="200" class="box exec"/>
<text x="1220.0" y="468.6" class="h t-exec c">03 / Governed execution — operation stays bounded</text>
<text x="1220.0" y="489.6" class="s c">the Harness governs one Agent · the Runtime hosts it · the Sandbox isolates effects</text>
<text x="1220.0" y="509.1" class="s c">scoped capabilities and file access · short-lived credentials</text>
<text x="1220.0" y="528.6" class="s c">network, time, and resource limits · explicit Agent Loop</text>
<text x="1220.0" y="547.1" class="xs i c">Constrained and recoverable</text>
</g>
