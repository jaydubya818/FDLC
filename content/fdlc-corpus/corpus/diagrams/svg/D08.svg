<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D08 d-D08">
<title id="t-D08">The Control Boundary</title>
<desc id="d-D08">Three parts of a factory and the flows between them. A human authority approves consequential decisions and feeds the factory control plane. The control plane, the durable system of record, sends authority down (solid arrows) to intelligence supply (models reason, agents act — replaceable by design) and to governed execution (harness, runtime, sandbox — constrained and recoverable). Evidence flows back up (dashed arrows). Governed execution hands Candidates and Evidence to independent verification, whose result returns to the control plane. Two panels list what is expected to change (models, agents, skills, prompts, tool adapters) and what is required to persist (intent, identity, authority, state, evidence, decisions, outcomes).</desc>
