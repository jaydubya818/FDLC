<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D05 d-D05">
<title id="t-D05">The Composition Hierarchy</title>
<desc id="d-D05">Seven nested levels from Model to FDLC. Top to bottom: FDLC (lifecycle, architecture, artifacts, governance, learning model) governs the Factory Ecosystem (many factories under one enterprise control plane), which governs the Control Plane (authority, policy, routing, state, registries, budgets), which governs the Factory (a reusable governed production capability versioned as a Factory Version), which bounds the Harness (operating envelope and loop controls around one agent), which bounds the Agent (reasoning plus goal, tools, context and working state), which uses the Model (a replaceable inference resource). A side panel lists cross-cutting roles: Tool, Skill, Agent Loop, Work Graph, Orchestrator, Runtime, Sandbox, Capability, Factory Platform.</desc>
