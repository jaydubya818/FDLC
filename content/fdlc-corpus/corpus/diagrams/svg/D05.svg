<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">The Composition Hierarchy</text>
<text x="60" y="108" class="sub">Each level is a distinct identity with its own lifecycle, version, qualification, and failure question</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D05</text></g>
<g id="level-fdlc">
<rect x="60" y="150" width="960" height="74" class="box neutral"/>
<text x="540.0" y="184.2" class="h c">FDLC</text>
<text x="540.0" y="205.2" class="s c">lifecycle · architecture · artifacts · governance · learning model</text>
</g>
<path id="a-0" d="M540.0,224 L540.0,242" class="au"/>
<text x="556.0" y="238" class="label">governs</text>
<g id="level-factory-ecosystem">
<rect x="86" y="242" width="908" height="74" class="box control"/>
<text x="540.0" y="276.2" class="h t-control c">Factory Ecosystem</text>
<text x="540.0" y="297.2" class="s c">many specialized factories coordinated through one enterprise control plane</text>
</g>
<path id="a-1" d="M540.0,316 L540.0,334" class="au"/>
<text x="556.0" y="330" class="label">governs</text>
<g id="level-control-plane">
<rect x="112" y="334" width="856" height="74" class="box control"/>
<text x="540.0" y="368.2" class="h t-control c">Control Plane</text>
<text x="540.0" y="389.2" class="s c">authority · policy · routing · state · registries · budgets — the durable system of record</text>
</g>
<path id="a-2" d="M540.0,408 L540.0,426" class="au"/>
<text x="556.0" y="422" class="label">governs</text>
<g id="level-factory">
<rect x="138" y="426" width="804" height="74" class="box exec"/>
<text x="540.0" y="460.2" class="h t-exec c">Factory</text>
<text x="540.0" y="481.2" class="s c">reusable governed production capability · versioned as an immutable Factory Version</text>
</g>
<path id="a-3" d="M540.0,500 L540.0,518" class="au"/>
<text x="556.0" y="514" class="label">bounds</text>
<g id="level-harness">
<rect x="164" y="518" width="752" height="74" class="box exec"/>
<text x="540.0" y="552.2" class="h t-exec c">Harness</text>
<text x="540.0" y="573.2" class="s c">operating envelope + loop controls around one agent · enforces locally, never holds enterprise authority</text>
</g>
<path id="a-4" d="M540.0,592 L540.0,610" class="au"/>
<text x="556.0" y="606" class="label">bounds</text>
<g id="level-agent">
<rect x="190" y="610" width="700" height="74" class="box exec"/>
<text x="540.0" y="644.2" class="h t-exec c">Agent</text>
<text x="540.0" y="665.2" class="s c">reasoning loop + goal + tools + context + working state · a worker inside the factory, not a factory</text>
</g>
<path id="a-5" d="M540.0,684 L540.0,702" class="au"/>
<text x="556.0" y="698" class="label">uses</text>
<g id="level-model">
<rect x="216" y="702" width="648" height="74" class="box exec"/>
<text x="540.0" y="736.2" class="h t-exec c">Model</text>
<text x="540.0" y="757.2" class="s c">inference resource — replaceable; the factory is more durable than the model inside it</text>
</g>
<path id="a-govern" d="M1046,160 L1046,780" class="au"/>
<text x="1066" y="300" class="tag c" transform="rotate(-90 1066 300)">authority flows down</text>
<path id="a-evidence" d="M1078,780 L1078,160" class="ev"/>
<text x="1066" y="640" class="tag c" transform="rotate(-90 1066 640)">evidence flows back</text>
<g id="roles"><rect x="1110" y="150" width="430" height="640" class="zone neutral"/></g>
<text x="1130" y="180" class="h3">Cross-cutting roles inside the hierarchy</text>
<text x="1130" y="214" class="h3">Tool</text>
<text x="1130" y="236" class="xs">capability invoked under a grant (API, CLI, MCP op)</text>
<text x="1130" y="278" class="h3">Skill</text>
<text x="1130" y="300" class="xs">reusable, versioned procedure loaded by the harness</text>
<text x="1130" y="342" class="h3">Agent Loop</text>
<text x="1130" y="364" class="xs">load → select → act → observe → evaluate → replan → stop</text>
<text x="1130" y="406" class="h3">Work Graph</text>
<text x="1130" y="428" class="xs">nodes · dependencies · gates · joins · retries · terminal states</text>
<text x="1130" y="470" class="h3">Orchestrator</text>
<text x="1130" y="492" class="xs">durable coordinator that advances the Work Graph</text>
<text x="1130" y="534" class="h3">Runtime</text>
<text x="1130" y="556" class="xs">process lifecycle · compute · queues · leases · persistence</text>
<text x="1130" y="598" class="h3">Sandbox</text>
<text x="1130" y="620" class="xs">isolation: filesystem · process · network · credentials</text>
<text x="1130" y="662" class="h3">Capability</text>
<text x="1130" y="684" class="xs">stable, provider-independent operation (“run tests”)</text>
<text x="1130" y="726" class="h3">Factory Platform</text>
<text x="1130" y="748" class="xs">shared enterprise foundation many factories reuse</text>
<text x="60" y="818" class="xs">Skills, Tools, and Context Packages are loaded, invoked, or frozen by the Harness. Agentic SDKs are an implementation choice inside the Agent &amp; Harness layer; FDLC sits above SDK choice.</text>
