<rect class="bg" width="1600" height="900"/>
<g id="header"><text x="60" y="76" class="title">Evidence Architecture — Claim to Authority</text>
<text x="60" y="108" class="sub">Evidence proves what ran. Verification judges it. A Decision applies authority. Authority is delegated, never inferred.</text>
<text x="1540" y="70" class="tag r">FDLC visual canon · D14</text></g>
<g id="claim">
<rect x="60" y="250" width="260" height="140" class="box exec"/>
<text x="190.0" y="299.7" class="h t-exec c">Claim</text>
<text x="190.0" y="319.7" class="xs c">producer assertion</text>
<text x="190.0" y="337.9" class="xs c">“criterion AC-3 satisfied”</text>
<text x="190.0" y="356.1" class="xs c">proves nothing by itself</text>
</g>
<path id="a-claim" d="M320,320 L365,320" class="fl"/>
<g id="evidence">
<rect x="365" y="250" width="260" height="140" class="box trust"/>
<text x="495.0" y="299.7" class="h t-trust c">Evidence</text>
<text x="495.0" y="319.7" class="xs c">what ran, what was observed</text>
<text x="495.0" y="337.9" class="xs c">tests · diffs · scans · traces</text>
<text x="495.0" y="356.1" class="xs c">bound to the exact subject digest</text>
</g>
<path id="a-evidence" d="M625,320 L670,320" class="fl"/>
<g id="verification">
<rect x="670" y="250" width="260" height="140" class="box trust"/>
<text x="800.0" y="299.7" class="h t-trust c">Verification</text>
<text x="800.0" y="319.7" class="xs c">independent judgment:</text>
<text x="800.0" y="337.9" class="xs c">does it satisfy the Specification?</text>
<text x="800.0" y="356.1" class="xs c">eligible ≠ accepted</text>
</g>
<path id="a-verification" d="M930,320 L975,320" class="fl"/>
<g id="decision">
<rect x="975" y="250" width="260" height="140" class="box trust human"/>
<text x="1105.0" y="299.7" class="h t-trust c">Decision</text>
<text x="1105.0" y="319.7" class="xs c">applies authority</text>
<text x="1105.0" y="337.9" class="xs c">acceptance · release · promotion</text>
<text x="1105.0" y="356.1" class="xs c">human or policy · server-authorized</text>
</g>
<path id="a-decision" d="M1235,320 L1280,320" class="fl"/>
<g id="authority">
<rect x="1280" y="250" width="260" height="140" class="box control"/>
<text x="1410.0" y="299.7" class="h t-control c">Authority</text>
<text x="1410.0" y="319.7" class="xs c">delegated from the control plane</text>
<text x="1410.0" y="337.9" class="xs c">never inferred from capability</text>
<text x="1410.0" y="356.1" class="xs c">authorizes the consequence</text>
</g>
<g id="control-plane">
<rect x="1280" y="150" width="260" height="64" class="box control"/>
<text x="1410.0" y="179.2" class="h2 t-control c">Control Plane</text>
<text x="1410.0" y="198.6" class="xs c">holds and delegates authority</text>
</g>
<path id="a-cp-authority" d="M1410,214 L1410,250" class="au"/>
<path id="a-authority-consequence" d="M1410,390 L1410,430" class="au"/>
<g id="consequence">
<rect x="1280" y="430" width="260" height="56" class="box exec"/>
<text x="1410.0" y="454.5" class="h3 t-exec c">Merge · Deploy · Activate</text>
<text x="1410.0" y="473.3" class="xs c">the consequence made real</text>
</g>
<text x="190" y="412" class="xs c t-human">✕ a claim never proves</text>
<text x="495" y="412" class="xs c t-human">✕ evidence never accepts</text>
<text x="800" y="412" class="xs c t-human">✕ verification never accepts</text>
<text x="1105" y="412" class="xs c">recomputes currentness at decision time</text>
<g id="binding"><rect x="60" y="510" width="1180" height="140" class="zone neutral"/></g>
<text x="80" y="538" class="h3">Evidence binding — every record is bound to an exact subject and its validity conditions</text>
<text x="80" y="566" class="xs">• Subject identity: commit · tree · diff hash · contract digest · source Attempt</text>
<text x="80" y="590" class="xs">• Producer identity · verifier identity + independence result</text>
<text x="80" y="614" class="xs">• Integrity: hash or signature</text>
<text x="650" y="566" class="xs">• Validity conditions (currentness): newest exact-bound verification decides</text>
<text x="650" y="590" class="xs">• Provenance chain: in-toto / SLSA-compatible statement · OTel trace refs</text>
<text x="650" y="614" class="xs">• Never borrow proof from another Attempt, candidate, PR head, revision, verifier, or policy</text>
<text x="60" y="690" class="tag">Evidence states — only a Current PASS satisfies a mandatory check</text>
<g id="state-missing"><rect x="60" y="702" width="150" height="42" class="chip neutral"/><text x="135.0" y="728.5" class="h3 c ">Missing</text></g>
<g id="state-pending"><rect x="226" y="702" width="150" height="42" class="chip neutral"/><text x="301.0" y="728.5" class="h3 c ">Pending</text></g>
<g id="state-current"><rect x="392" y="702" width="150" height="42" class="chip trust"/><text x="467.0" y="728.5" class="h3 c ">Current ✓</text></g>
<g id="state-stale"><rect x="558" y="702" width="150" height="42" class="chip neutral"/><text x="633.0" y="728.5" class="h3 c ">Stale</text></g>
<g id="state-conflicting"><rect x="724" y="702" width="170" height="42" class="chip neutral"/><text x="809.0" y="728.5" class="h3 c ">Conflicting</text></g>
<g id="state-superseded"><rect x="910" y="702" width="150" height="42" class="chip neutral"/><text x="985.0" y="728.5" class="h3 c ">Superseded</text></g>
<text x="60" y="774" class="xs">Missing, stale, skipped, unconfigured, errored, insufficiently independent, or conflicting proof cannot become success. REVOKED maps to Stale; REJECTED maps to Missing.</text>
<g id="decision-kinds"><rect x="1280" y="510" width="260" height="234" class="zone trust"/><text x="1296" y="536" class="h3 t-trust">Decision kinds</text></g>
<text x="1300" y="562" class="xs mono">plan-approval</text>
<text x="1300" y="584" class="xs mono">routing</text>
<text x="1300" y="606" class="xs mono">admission</text>
<text x="1300" y="628" class="xs mono">acceptance</text>
<text x="1300" y="650" class="xs mono">release-authorization</text>
<text x="1300" y="672" class="xs mono">promotion</text>
<text x="1300" y="694" class="xs mono">restoration</text>
<text x="1300" y="716" class="xs mono">exception</text>
<text x="60" y="812" class="xs">Claim → Evidence → Verification → Decision → Authority. Context Packages, memory, evaluations, and review intelligence are advisory: acceptanceAuthority is always false.</text>
<g id="legend">
<rect x="60" y="847" width="26" height="16" class="box intent" rx="3"/>
<text x="94" y="860" class="xs">Intent</text>
<rect x="155.28" y="847" width="26" height="16" class="box control" rx="3"/>
<text x="189.28" y="860" class="xs">Control</text>
<rect x="260.08000000000004" y="847" width="26" height="16" class="box exec" rx="3"/>
<text x="294.08000000000004" y="860" class="xs">Execution</text>
<rect x="383.36000000000007" y="847" width="26" height="16" class="box trust" rx="3"/>
<text x="417.36000000000007" y="860" class="xs">Trust</text>
<rect x="476.4000000000001" y="847" width="26" height="16" class="box learn" rx="3"/>
<text x="510.4000000000001" y="860" class="xs">Learning</text>
<rect x="592.1200000000001" y="847" width="26" height="16" class="box neutral human" rx="3"/>
<text x="626.1200000000001" y="860" class="xs">Human authority</text>
<path d="M765.1600000000001,855 L809.1600000000001,855" class="au"/><text x="819.1600000000001" y="860" class="xs">authority / flow (solid)</text>
<path d="M987.4000000000001,855 L1031.4,855" class="ev"/><text x="1041.4" y="860" class="xs">evidence (dashed, back)</text>
<path d="M1221.1200000000001,855 L1265.1200000000001,855" class="ln"/><text x="1275.1200000000001" y="860" class="xs">learning (dashed)</text>
</g>
</svg>
