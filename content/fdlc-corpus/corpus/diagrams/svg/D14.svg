<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" class="fd" role="img" aria-labelledby="t-D14 d-D14">
<title id="t-D14">Evidence Architecture — Claim to Authority</title>
<desc id="d-D14">A five-step chain: a Claim (producer assertion) is backed by Evidence (what ran and what was observed, bound to the exact subject digest), judged by independent Verification (does the evidence satisfy the Specification?), applied by a Decision (acceptance, release-authorization, promotion — by a human or policy actor, server-authorized), which exercises Authority delegated from the control plane to authorize a consequence such as merge, deploy or activate. Panels below list the evidence binding (subject identity, producer, verifier and independence, integrity, validity conditions, provenance chain), the six evidence states — Missing, Pending, Current, Stale, Conflicting, Superseded — of which only Current satisfies a mandatory check, and the Decision kinds.</desc>
