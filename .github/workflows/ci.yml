name: FDLC and Fab qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualification:
    name: FDLC and Fab Qualification
    # Fab's Experimental native bridge is macOS arm64; Linux is not qualified.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix packages/fab
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:contained --prefix packages/fab
      - run: npm run package:private --prefix packages/fab
      - run: npx --no-install playwright install chromium
      - run: npm run test:browser
      - run: npm run build:vercel
      - run: npm run test:browser:vercel
      - run: npm audit --audit-level=high
