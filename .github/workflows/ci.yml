name: FDLC and Fab qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualification:
    name: FDLC and Fab Qualification
    # Fab's Experimental native bridge is macOS arm64; Linux is not qualified.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fab permits Cellar/system check executables; setup-node's tool cache is outside that boundary.
      - name: Select Homebrew Node 24 for contained checks
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install node@24
          echo /opt/homebrew/opt/node@24/bin >> "$GITHUB_PATH"
          /opt/homebrew/opt/node@24/bin/node -e 'const fs = require("node:fs"); const p = fs.realpathSync(process.execPath); if (process.platform !== "darwin" || process.arch !== "arm64" || !process.version.startsWith("v24.") || !p.startsWith("/opt/homebrew/Cellar/")) process.exit(1); console.log(JSON.stringify({version:process.version, path:p, sha256:require("node:crypto").createHash("sha256").update(fs.readFileSync(p)).digest("hex")}));'
      - run: npm ci
      - run: npm ci --prefix packages/fab
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run starter:check
      - run: npm run starter:test
      - run: npm test
      - run: npm run test:contained --prefix packages/fab
      - name: Build an ephemeral package without replacing the pinned archive
        run: |
          mkdir -p "$RUNNER_TEMP/fab-package"
          npm run package:private --prefix packages/fab -- "$RUNNER_TEMP/fab-package"
      - run: npx --no-install playwright install chromium
      - run: npm run test:browser
      - run: npm run build:vercel
      - run: npm run test:browser:vercel
      - run: npm audit --audit-level=high
